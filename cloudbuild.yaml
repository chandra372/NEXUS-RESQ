steps:
  # 1. Build the container image from root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nexus-resq:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nexus-resq:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  # 2. Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/nexus-resq:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nexus-resq'
      - '--image'
      - 'gcr.io/$PROJECT_ID/nexus-resq:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8000'
      - '--set-env-vars'
      - 'DATASET_PATH=/app/nexus-resq/large_emergency_dataset'

images:
  - 'gcr.io/$PROJECT_ID/nexus-resq:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/nexus-resq:latest'

options:
  logging: CLOUD_LOGGING_ONLY
